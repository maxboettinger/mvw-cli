name: Release

# Publishes to PyPI when you push a version tag, e.g. `git tag v0.1.1 && git push origin v0.1.1`.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # The `pypi` environment must match the trusted-publisher config on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/mvw-cli/

    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing (OIDC) — no token needed

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Verify the git tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv version --short)"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG. Run 'uv version' and re-tag."
            exit 1
          fi

      - name: Run tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        run: uv publish
        # --- API-token alternative -------------------------------------------
        # If you use a token instead of Trusted Publishing, delete the
        # `id-token: write` permission and the `environment:` block above, then
        # replace the line above with:
        #   run: uv publish
        #   env:
        #     UV_PUBLISH_TOKEN: ${{ secrets.PYPI_TOKEN }}
