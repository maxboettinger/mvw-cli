name: Release

# Publishes to PyPI when you push a version tag, e.g. `git tag v0.1.1 && git push origin v0.1.1`.
on:
  push:
    tags:
      - "v*"

jobs:
  release:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest

    # The `pypi` environment must match the trusted-publisher config on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/mvw-cli/

    permissions:
      contents: read
      id-token: write # required for PyPI Trusted Publishing (OIDC) — no token needed

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true

      - name: Verify the git tag matches the package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(uv version --short)"
          echo "tag=$TAG package=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag v$TAG does not match pyproject version $PKG. Run 'uv version' and re-tag."
            exit 1
          fi

      - name: Run tests
        run: uv run pytest -q

      - name: Build sdist and wheel
        run: uv build

      - name: Publish to PyPI (Trusted Publishing / OIDC)
        run: uv publish

  github-release:
    name: Create GitHub Release
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Create release with generated notes
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
