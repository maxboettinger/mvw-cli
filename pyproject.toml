[project]
name = "or-cli"
version = "0.1.0"
description = "CLI for searching and downloading from MediathekViewWeb"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.scripts]
mvw = "mvw.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvw"]

[tool.pytest.ini_options]
markers = ["live: hits the real MediathekViewWeb API (opt-in)"]
addopts = "-m 'not live'"
