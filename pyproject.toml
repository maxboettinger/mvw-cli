[project]
name = "mvw-cli"
description = "Search and download German public-broadcasting media from MediathekViewWeb, with Plex-friendly season downloads."
readme = "README.md"
requires-python = ">=3.11"
version = "0.2.0"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Max Boettinger", email = "perplexity@bttngr.de" }]
keywords = [
    "mediathek",
    "mediathekviewweb",
    "ard",
    "zdf",
    "german",
    "television",
    "download",
    "cli",
    "plex",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: German",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "httpx>=0.27",
    "platformdirs>=4.2",
]

[project.scripts]
mvw = "mvw.cli:app"
# Alias matching the distribution name so `uvx mvw-cli ...` works without --from.
mvw-cli = "mvw.cli:app"

[project.urls]
Homepage = "https://github.com/maxboettinger/mvw-cli"
Repository = "https://github.com/maxboettinger/mvw-cli"
Issues = "https://github.com/maxboettinger/mvw-cli/issues"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "respx>=0.21",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mvw"]

[tool.hatch.build.targets.sdist]
include = [
    "src/mvw",
    "tests",
    "README.md",
    "LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# En/em dashes are used deliberately in user-facing strings and title-cleanup regexes.
allowed-confusables = ["–", "—"]

[tool.ruff.lint.flake8-bugbear]
# Typer's API is call-in-default by design.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.pytest.ini_options]
markers = ["live: hits the real MediathekViewWeb API (opt-in)"]
addopts = "-m 'not live'"
